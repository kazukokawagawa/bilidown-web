# pnpm 9.10.0 (used by Cloudflare Workers Builds) requires a non-empty `packages` field.
# pnpm 11 wrote the allowBuilds placeholders below; decide them explicitly so it does not
# regenerate the file with "set this to true or false" values.
allowBuilds:
  electron-winstaller: true
  unrs-resolver: true
packages:
  - '.'
